# Masaüstü uygulamasını derler ve GitHub Releases'e koyar.
# Sabit indirme linki: https://github.com/aliaskin/konu-mauygulamas-/releases/latest/download/KankaChat-Setup.exe
name: Masaüstü uygulaması
on:
  push:
    branches: [claude/discord-like-chat-app-dzvaz5, main]
    paths: [desktop/**, .github/workflows/desktop.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency: desktop
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            files: |
              desktop/dist/KankaChat-Setup.exe
              desktop/dist/KankaChat-Setup.exe.blockmap
              desktop/dist/latest.yml
              desktop/dist/KankaChat-Portable.exe
          - os: ubuntu-latest
            script: dist:linux
            files: |
              desktop/dist/KankaChat.AppImage
              desktop/dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # Her derleme yeni bir sürüm numarası alır; kurulu uygulamalar bununla kendini günceller
      - run: npm version 1.0.${{ github.run_number }} --no-git-tag-version
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: kanka-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kanka Chat masaüstü 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Windows:** `KankaChat-Setup.exe` (kurulum) veya `KankaChat-Portable.exe` (kurulumsuz, tek dosya).
            **Linux:** `KankaChat.AppImage`

            Uygulama arayüzü her açılışta web sürümünden yüklenir; yeni özellikler uygulamayı yeniden kurmadan gelir.
            Kurulu uygulama (Setup) kendi kabuğunu da arka planda günceller.
            Windows "bilinmeyen yayıncı" uyarısı verirse: **Ek bilgi → Yine de çalıştır**.
          files: out/*
