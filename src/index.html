<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Kanka Chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='30' fill='%235865f2'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3EK%3C/text%3E%3C/svg%3E">
<style>/*CSS*/</style>
</head>
<body>
<div id="app">
  <nav id="rail" aria-label="Sunucular"></nav>
  <aside id="side">
    <header id="side-h"></header>
    <div id="chans"></div>
    <div id="vbar"></div>
    <div id="mepanel"></div>
  </aside>
  <main id="main">
    <header id="main-h"></header>
    <div id="body">
      <section id="chat">
        <div id="msgs" role="log" aria-live="polite"></div>
        <div id="composer-wrap">
          <div id="replybar" hidden></div>
          <form id="composer" autocomplete="off">
            <button type="button" class="ic-btn" data-act="attach" title="Dosya / resim gönder">＋</button>
            <textarea id="input" rows="1" maxlength="4000" placeholder="Mesaj gönder"></textarea>
            <button type="button" class="ic-btn" data-act="emoji" title="Emoji">😊</button>
          </form>
          <div id="typing"></div>
        </div>
      </section>
      <section id="stage" hidden></section>
      <aside id="members"></aside>
    </div>
  </main>
</div>
<div id="overlay" hidden></div>
<div id="pop" hidden></div>
<div id="toasts"></div>
<div id="audios" hidden></div>
<input type="file" id="file" hidden multiple>
<script>/*JS*/</script>
</body>
</html>
