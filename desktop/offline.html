<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Kanka Chat</title>
<style>
  :root { color-scheme: dark; font-family: "Segoe UI", system-ui, sans-serif; }
  html, body { height: 100%; margin: 0; background: #313338; color: #dbdee1; }
  body { display: grid; place-items: center; }
  .box { text-align: center; max-width: 420px; padding: 24px; }
  .logo { width: 72px; height: 72px; border-radius: 22px; background: #5865f2; color: #fff; font: 700 40px/72px system-ui; margin: 0 auto 16px; }
  h1 { font-size: 22px; color: #f2f3f5; margin: 0 0 8px; }
  p { color: #949ba4; margin: 0 0 20px; line-height: 1.5; }
  button { background: #5865f2; color: #fff; border: 0; border-radius: 4px; padding: 10px 20px; font: 500 14px system-ui; cursor: pointer; }
  button:hover { background: #4752c4; }
  small { display: block; margin-top: 16px; color: #6d6f78; }
</style>
</head>
<body>
<div class="box">
  <div class="logo">K</div>
  <h1>Bağlanılamadı</h1>
  <p>Kanka Chat'e ulaşılamıyor. İnternet bağlantını kontrol et; bağlantı gelince kendiliğinden yeniden denenecek.</p>
  <button id="retry">Tekrar dene</button>
  <small id="err"></small>
</div>
<script>
  const q = new URLSearchParams(location.search)
  const url = q.get('url')
  document.getElementById('err').textContent = q.get('err') || ''
  const go = () => { if (url && /^https:\/\//.test(url)) location.href = url }
  document.getElementById('retry').addEventListener('click', go)
  addEventListener('online', go)
  setInterval(() => { if (navigator.onLine) go() }, 8000)
</script>
</body>
</html>
